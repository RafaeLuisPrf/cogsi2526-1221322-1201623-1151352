# Updated App properties
deployment.version=@project_version@
deployment.timestamp=@build_timestamp@

# HARDCODED CORRECT URL
spring.datasource.url=jdbc:h2:tcp://127.0.0.1:9092/file:/app/mydb
spring.datasource.username=SA
